name: Deploy audience
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audience-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            audience/package-lock.json
      - run: npm ci
      - run: npm ci --prefix audience
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- browser-tests/presentation.spec.mjs browser-tests/stage-projection.spec.mjs
      - name: Deploy existing audience Worker
        working-directory: audience
        env:
          CLOUDFLARE_ACCOUNT_ID: 3118f9560af77a0819ba24e1a14bcc9e
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          npx wrangler deploy --name lecture-votes-20260909-bfbeb2745cce
      - name: Check public endpoint without changing votes
        run: curl --fail --retry 3 https://lecture-votes-20260909-bfbeb2745cce.survivejs.workers.dev/api/audience --output /dev/null
